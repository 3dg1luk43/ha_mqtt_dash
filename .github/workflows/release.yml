name: Release

# On a version tag: run tools/release_check.sh against it, then open a DRAFT
# GitHub release whose body is the tag's CHANGELOG.md section, with the newest
# iPad packages from releases/ attached. Publishing stays a manual click.
# Ported from ha_creality_ws.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to verify against (e.g. v0.6.0). Never drafts a release."
        required: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: pip install -r tools/requirements-test.txt
      - name: Release preflight
        env:
          # Never interpolate inputs into shell code directly.
          TAG_INPUT: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          TAG="${TAG_INPUT:-$REF_TAG}"
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -Eq '^v?[0-9][A-Za-z0-9._-]*$'; then
            echo "Not a version tag: $TAG" >&2; exit 1
          fi
          if [ -n "$TAG" ]; then bash tools/release_check.sh --tag "$TAG"; else bash tools/release_check.sh; fi

  draft:
    needs: preflight
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Cut the release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["TAG"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          head = re.search(rf"^##\s+\[?v?{re.escape(version)}\]?(?:\s|$).*$", text, re.M)
          if not head:
              sys.exit(f"no CHANGELOG.md entry for {version}")
          rest = text[head.end():]
          nxt = re.search(r"^##\s", rest, re.M)
          body = head.group(0) + rest[: nxt.start() if nxt else len(rest)].rstrip() + "\n"
          open(os.environ["RUNNER_TEMP"] + "/notes.md", "w", encoding="utf-8").write(body)
          PY
      - name: Create the draft with the iPad packages attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; leaving it alone."; exit 0
          fi
          assets=()
          for re in '\+legacy_iphoneos-arm\.deb$' '\+modern_iphoneos-arm\.deb$' '^com\.3dg1luk43\.mqttdash-kiosk_'; do
            f=$(ls releases | grep -E "$re" | sort -V | tail -1 || true)
            [ -n "$f" ] && assets+=("releases/$f")
          done
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $PRERELEASE "${assets[@]}"
